services:
  ai-foundation-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_foundation_container
    ports:
      - "8000:8000"
    volumes:
      # Mount thư mục hiện tại vào container để hot-reload khi sửa code
      - .:/app
    environment:
      - ENV=development
    restart: unless-stopped
